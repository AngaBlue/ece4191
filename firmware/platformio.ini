; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32s3cam_lonelybinary

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
upload_protocol = esptool
build_flags = -Ofast
lib_deps = rjsachse/ESP32-RTSPServer@^1.3.5
	madhephaestus/ESP32Servo@3.0.8

[env:esp32s3cam_lonelybinary]
board = esp32s3cam_lonelybinary
build_flags = -Ofast -D esp32s3cam_lonelybinary -D OVERRIDE_RTSP_SINGLE_CLIENT_MODE

[env:esp32cam_aithinker]
board = esp32cam
build_type = debug
build_flags = -D esp32cam_aithinker -D OVERRIDE_RTSP_SINGLE_CLIENT_MODE
monitor_rts = 0
monitor_dtr = 0
monitor_filters = esp32_exception_decoder
